services:
  - type: worker
    name: el-robot-futbolero-live
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm run worker
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: API_FOOTBALL_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
