services:
  - type: worker
    name: el-robot-futbolero-live
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm run worker
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: API_FOOTBALL_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ZERNIO_API_KEY
        sync: false
      - key: ZERNIO_ACCOUNT_ID
        sync: false
      - key: ZERNIO_TEXT_PRESET_ID
        sync: false
      - key: BRIGHT_DATA_API_KEY
        sync: false
      - key: BRIGHT_DATA_DATASET_ID
        sync: false
      - key: BRIGHT_DATA_PAGE_URLS
        sync: false
